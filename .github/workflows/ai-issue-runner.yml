name: AI Issue Runner

# 组织级 issue 分析执行层。只以 workflow_call 暴露：业务仓的触发薄壳负责事件过滤与
# 防刷判定，本文件负责执行与写回。执行器代码由 ai-gateway 的 `snapshot` Release 发布，
# 本工作流不编译任何代码；ACP 工具直接使用官方预编译包。
#
# 权限与凭据边界（改动时逐条保持）：
# - 顶层 permissions 为空，权限只在真正需要的 job 内声明；
# - 模型 key 只出现在 analysis 的 analysis.js 步骤，GitHub 写凭据只出现在 finalize 的
#   App 签发步骤，两类凭据不进入同一个 job；
# - issue 文本与 inputs 只经 env 进入脚本，不拼接进 shell，不参与路径构造。
on:
  workflow_call:
    inputs:
      issue:
        description: issue 编号
        required: true
        type: string
      event:
        description: 事件类型：issues 或 issue_comment
        required: true
        type: string
      comment_id:
        description: 触发评论 id（issue_comment 事件，用于 gate 校验）
        required: false
        type: string
        default: ""
      dry_run:
        description: 为 true 时只跑 gate/analysis、不发评论
        required: false
        type: string
        default: "false"
      force:
        description: 为 true 时无视 bot:v1 标记与 7 天窗口
        required: false
        type: string
        default: "false"
      gateway_ref:
        description: 执行器仓库（GregTech6CE/ai-gateway）的 ref
        required: false
        type: string
        default: master

permissions: {}

# 同一 issue 的请求串行，不互相取消，避免半途终止留下无法回写的状态。
concurrency:
  group: ai-issue-${{ github.repository }}-${{ inputs.issue }}
  cancel-in-progress: false

env:
  CI_ROOT: .gateway

jobs:
  # 前置只读 Job：配置面、执行器与 gate 判定一次完成，产物供 analysis 与 finalize 复用。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ARTIFACT_BASE: https://github.com/GregTech6CE/ai-gateway/releases/download/snapshot
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}
      code_repo: ${{ steps.gate.outputs.code_repo }}
      code_ref: ${{ steps.gate.outputs.code_ref }}
      code_refs: ${{ steps.gate.outputs.code_refs }}
      golden_repo: ${{ steps.gate.outputs.golden_repo }}
      golden_commit: ${{ steps.gate.outputs.golden_commit }}
      cache_prefix: ${{ steps.gate.outputs.cache_prefix }}
      issue_title: ${{ steps.gate.outputs.issue_title }}
    steps:
      # 只取执行器仓库的配置面；执行代码来自 Release 包，不从检出目录运行。
      - name: Checkout gateway config
        uses: actions/checkout@v7
        with:
          repository: GregTech6CE/ai-gateway
          ref: ${{ inputs.gateway_ref }}
          path: .gateway
          sparse-checkout: |
            config
            prompts
            templates
          persist-credentials: false

      # 下载与校验集中在门禁 Job：analysis 的 harden-runner 不需要为 Release CDN 放宽。
      - name: Download CI bundle
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/ci-bundle"
          rm -rf "$work" .gateway/.git .gateway/apps/ci/dist
          mkdir -p "$work" .gateway/apps/ci

          fetch() {
            for attempt in 1 2 3; do
              if curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 180 \
                  "$1" -o "$2"; then
                return 0
              fi
              echo "下载失败（第 $attempt 次）：$1"
              sleep 3
            done
            return 1
          }

          fetch "$ARTIFACT_BASE/SHASUMS256.txt" "$work/SHASUMS256.txt"

          archive=$(grep -oE 'gt6-ci-[0-9a-f]{7,40}\.tgz' "$work/SHASUMS256.txt" | head -n 1 || true)
          if [ -z "$archive" ]; then
            echo "::error::SHASUMS256.txt 中没有 gt6-ci 包名"
            exit 1
          fi
          echo "使用执行器包：$archive"

          if ! grep -Eq "^[0-9a-f]{64}  ${archive//./\\.}$" "$work/SHASUMS256.txt"; then
            echo "::error::SHASUMS256.txt 中没有 $archive 的校验行"
            exit 1
          fi

          fetch "$ARTIFACT_BASE/$archive" "$work/$archive"
          (cd "$work" && sha256sum -c --ignore-missing SHASUMS256.txt)

          # 归档布局固定为 package/dist，直接落到 CI_ROOT 约定的 apps/ci/dist。
          tar -xzf "$work/$archive" -C .gateway/apps/ci --strip-components=1 package/dist
          test -f .gateway/apps/ci/dist/jobs/gate.js

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Gate (read-only)
        id: gate
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment_id }}
          EVENT: ${{ inputs.event }}
          REQUEST_ID: ${{ github.run_id }}
          FORCE: ${{ inputs.force }}
          SELF_TOKEN: ${{ github.token }}
          B_REPO: ${{ github.repository }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          MODEL_HEALTH: ${{ vars.MODEL_HEALTH }}
        run: node .gateway/apps/ci/dist/jobs/gate.js
      # 单份产物同时携带执行器、配置与 gate 输入：gate 拒绝或 analysis 跳过时，
      # finalize 仍要有执行器可渲染失败结论。
      - name: Upload gate bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-bundle-${{ github.run_id }}
          path: .gateway
          # 搜索根是隐藏目录，默认的隐藏文件过滤会把整棵目录跳过。
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  analysis:
    needs: gate
    if: needs.gate.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      scan_upload: ${{ steps.analysis.outputs.scan_upload }}
    steps:
      # 出网白名单：与 deploy/egress-allowlist.txt 对齐。
      # 改这里时同步改那份文件，否则 Docker 侧与 CI 侧的边界会漂移。
      - name: Harden runner (egress allowlist)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            *.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.mistral.ai:443
            chat.mistral.ai:443
            api.cline.bot:443
      # 预编译包从 Releases 直拉：github.com 与 *.githubusercontent.com 已在白名单内，
      # 不需要 setup-uv 与 PyPI。缓存解压后的目录，key 固定为平台与版本。
      # 只读恢复：缓存写入限定手动触发，其余事件由 ai-cache-warm.yml 保活。
      - name: Cache vibe-acp
        id: vibe-cache
        uses: actions/cache/restore@v6
        with:
          path: .tools/vibe-acp
          key: vibe-acp-linux-x86_64-3.1.4
      - name: Install vibe-acp
        if: steps.vibe-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .tools/vibe-acp
          archive="$RUNNER_TEMP/vibe-acp-linux-x86_64-3.1.4.tar.gz"
          curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 600 \
            -o "$archive" \
            "https://github.com/mistralai/mistral-vibe/releases/download/v3.1.4/vibe-acp-linux-x86_64-3.1.4.tar.gz"
          echo "934a79356755821a31e6ce1aee7f7f1eacb6b1e6c78901acf1eb7fc4650aece7  $archive" | sha256sum -c -
          tar -xzf "$archive" -C .tools/vibe-acp
      - name: Verify vibe-acp
        run: |
          set -euo pipefail
          echo "$PWD/.tools/vibe-acp" >> "$GITHUB_PATH"
          installed=$("$PWD/.tools/vibe-acp/vibe-acp" --version)
          echo "$installed"
          case "$installed" in
            *" 3.1.4") ;;
            *) echo "::error::vibe-acp 版本不是 3.1.4：$installed"; exit 1 ;;
          esac
      # 冷启动只在手动触发时补齐缓存；issues / issue_comment 不写缓存。
      - name: Save vibe-acp
        if: github.event_name == 'workflow_dispatch' && steps.vibe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .tools/vibe-acp
          key: vibe-acp-linux-x86_64-3.1.4
      - name: Install ripgrep
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rg-bin"
          archive="$RUNNER_TEMP/ripgrep-16.0.0-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 180 \
            -o "$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/16.0.0/ripgrep-16.0.0-x86_64-unknown-linux-musl.tar.gz"
          echo "54268ab4643c00a290a29b0086066d64b3f56236dd805ec64629a86f9bd29fd0  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/rg-bin" --strip-components=1 ripgrep-16.0.0-x86_64-unknown-linux-musl/rg
          echo "$RUNNER_TEMP/rg-bin" >> "$GITHUB_PATH"
          installed=$("$RUNNER_TEMP/rg-bin/rg" --version | head -n 1)
          echo "$installed"
          case "$installed" in
            "ripgrep 16.0.0"*) ;;
            *) echo "::error::ripgrep 版本不是 16.0.0：$installed"; exit 1 ;;
          esac
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Download gate bundle
        uses: actions/download-artifact@v8
        with:
          name: gate-bundle-${{ github.run_id }}
          path: .gateway
      # 镜像缓存按内容寻址：恢复用前缀取最近一份，保存用主分支 HEAD SHA。
      - name: Restore GT6 mirror
        uses: actions/cache/restore@v6
        with:
          path: .cache/gt6.git
          key: ${{ needs.gate.outputs.cache_prefix }}-${{ github.run_id }}
          restore-keys: ${{ needs.gate.outputs.cache_prefix }}-
      - name: Restore golden mirror
        id: golden-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/golden.git
          key: golden-${{ needs.gate.outputs.golden_commit }}
          restore-keys: golden-
      - name: Sync mirror and create worktrees
        id: sync-mirrors
        env:
          CODE_REPO: ${{ needs.gate.outputs.code_repo }}
          CODE_REFS: ${{ needs.gate.outputs.code_refs }}
          GOLDEN_REPO: ${{ needs.gate.outputs.golden_repo }}
          GOLDEN_COMMIT: ${{ needs.gate.outputs.golden_commit }}
        run: |
          set -euo pipefail
          mkdir -p .cache .gateway/code
          gt6_before=""
          if [ -d .cache/gt6.git ]; then
            gt6_before=$(git -C .cache/gt6.git rev-parse --verify -q refs/heads/master || true)
            git -C .cache/gt6.git remote set-url origin "https://github.com/$CODE_REPO.git"
            # 缓存会带上一次运行的 worktree 注册信息；工作区路径变化后 fetch 会拒绝更新已登记的分支。
            git -C .cache/gt6.git worktree prune
            rm -rf .cache/gt6.git/worktrees
            git -C .cache/gt6.git fetch --prune --tags
          else
            git clone --mirror "https://github.com/$CODE_REPO.git" .cache/gt6.git
          fi
          gt6_after=$(git -C .cache/gt6.git rev-parse refs/heads/master)
          echo "gt6_sha=$gt6_after" >> "$GITHUB_OUTPUT"
          if [ "$gt6_before" != "$gt6_after" ]; then
            echo "gt6_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gt6_changed=false" >> "$GITHUB_OUTPUT"
          fi
          worktree_root="$PWD/.gateway/code"
          primary=""
          for ref in $CODE_REFS; do
            slug=$(printf '%s' "$ref" | tr '/ ' '__')
            if [ -z "$primary" ]; then
              git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" "$ref" || \
                git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" master
              primary="$slug"
            else
              git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" "$ref" || \
                echo "ref $ref unavailable; skipping"
            fi
          done
          ln -sfn "$primary" .gateway/code/current
          # golden 是上游原版 GT6 的固定提交：6CE 的行号引用与行为对齐都以它为基准。
          if [ -n "${GOLDEN_REPO:-}" ] && [ -n "${GOLDEN_COMMIT:-}" ]; then
            if [ -d .cache/golden.git ]; then
              git -C .cache/golden.git remote set-url origin "https://github.com/$GOLDEN_REPO.git"
              git -C .cache/golden.git worktree prune
              rm -rf .cache/golden.git/worktrees
              # golden 是固定提交：缓存里已经有它就不再联网。
              if ! git -C .cache/golden.git cat-file -e "$GOLDEN_COMMIT^{commit}" 2>/dev/null; then
                git -C .cache/golden.git fetch --prune --tags || true
              fi
            else
              git clone --mirror "https://github.com/$GOLDEN_REPO.git" .cache/golden.git
            fi
            if git -C .cache/golden.git cat-file -e "$GOLDEN_COMMIT^{commit}" 2>/dev/null; then
              git -C .cache/golden.git worktree add -f "$worktree_root/golden" "$GOLDEN_COMMIT"
              echo "golden: $GOLDEN_REPO@$GOLDEN_COMMIT"
            else
              echo "golden commit $GOLDEN_COMMIT not reachable; skipping"
            fi
          fi
      # 只有主分支前进时才落一份新缓存；同一 SHA 重复保存既浪费又会报 save failed。
      # 缓存写入同样限定手动触发，被动事件由 ai-cache-warm.yml 的定时保活维护。
      - name: Save GT6 mirror
        if: always() && github.event_name == 'workflow_dispatch' && steps.sync-mirrors.outputs.gt6_changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/gt6.git
          key: ${{ needs.gate.outputs.cache_prefix }}-${{ steps.sync-mirrors.outputs.gt6_sha }}
      - name: Save golden mirror
        if: always() && github.event_name == 'workflow_dispatch' && steps.golden-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/golden.git
          key: golden-${{ needs.gate.outputs.golden_commit }}
      - name: Prefetch attachments
        run: node .gateway/apps/ci/dist/jobs/prefetch.js
      - name: Analyse issue
        id: analysis
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          MODEL_KEY_MISTRAL: ${{ secrets.MODEL_KEY_MISTRAL }}
          MODEL_KEY_CLINEPASS: ${{ secrets.MODEL_KEY_CLINEPASS }}
        run: node .gateway/apps/ci/dist/jobs/analysis.js
      # 上传闸门：任一文件扫描失败就不提供产物目录，避免未脱敏内容进入公开 artifact。
      - name: Upload analysis outputs
        if: always() && steps.analysis.outputs.scan_upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: analysis-${{ github.run_id }}
          path: .gateway/outputs
          if-no-files-found: ignore
          retention-days: 30
      # 扫描失败时只留报告：result.json 自身已脱敏，只含状态与命中清单。
      - name: Upload scan report
        if: always() && steps.analysis.outputs.scan_upload != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: analysis-${{ github.run_id }}-report
          path: .gateway/outputs/result.json
          if-no-files-found: ignore
          retention-days: 30

  # 确定性写入。不运行模型、不读 issue 正文作为指令，只消费 gate/analysis 的结构化产物。
  # 除 dry_run 的写回外，finalize 总是运行：analysis 失败、超时或被取消都要回写失败结论。
  finalize:
    needs: [gate, analysis]
    if: always() && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Download gate bundle
        uses: actions/download-artifact@v8
        with:
          name: gate-bundle-${{ github.run_id }}
          path: .gateway
      - name: Download analysis outputs
        if: needs.analysis.outputs.scan_upload == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: analysis-${{ github.run_id }}
          path: .gateway/outputs
      # analysis 跳过时两份产物都不存在；扫描未放行时只有报告。条件即产物存在性。
      - name: Download scan report
        if: needs.analysis.result != 'skipped' && needs.analysis.outputs.scan_upload != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: analysis-${{ github.run_id }}-report
          path: .gateway/outputs
      - name: App token (issues:write on this repository)
        id: app_issue
        if: ${{ (inputs.dry_run || 'false') != 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
          permission-issues: write
      # actions/create-github-app-token 没有 permission-variables 输入，
      # 这里使用 App 的完整权限集；该 job 不运行模型，也不接触不可信正文。
      - name: App token (health variable)
        id: app_health
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
      - name: Render
        if: always()
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          B_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REQUEST_ID: ${{ github.run_id }}
        run: node .gateway/apps/ci/dist/jobs/render.js
      - name: Write back
        if: ${{ always() && (inputs.dry_run || 'false') != 'true' }}
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ""
          GH_RW_TOKEN: ${{ steps.app_issue.outputs.token }}
          GH_RO_TOKEN: ${{ steps.app_issue.outputs.token }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node .gateway/apps/ci/dist/jobs/write-back.js
      - name: Update model health
        if: always()
        continue-on-error: true
        env:
          MODEL_HEALTH_TOKEN: ${{ steps.app_health.outputs.token }}
          B_REPO: ${{ github.repository }}
          MODEL_HEALTH_PATH: outputs/model_health.json
        run: node .gateway/apps/ci/dist/jobs/update-health.js
